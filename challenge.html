<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabbed Interface Challenge</title>
    <style>
        .active {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <button class="tab-btn active" onclick="showTab(event, 'content1')">Tab 1</button>
        <button class="tab-btn" onclick="showTab(event, 'content2')">Tab 2</button>
        <button class="tab-btn" onclick="showTab(event, 'content3')">Tab 3</button>
    </div>
    <div id="content1" class="tab-panel" style="display: block;">
        <p>This is paragraph 1.</p>
    </div>

    <div id="content2" class="tab-panel" style="display: none;">
        <p>This is paragraph 2.</p>
    </div>

    <div id="content3" class="tab-panel" style="display: none;">
        <p>This is paragraph 3.</p>
    </div>

    <!-- JavaScript file -->
    <script src="challenge.js"></script>
</body>
</html>
